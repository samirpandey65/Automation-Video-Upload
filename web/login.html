<!doctype html><html><head><meta charset="utf-8"><title>Login — OmniCast Studio</title><link rel="stylesheet" href="/static/layout.css?v=24"><style>body{display:grid;place-items:center;min-height:100vh}.login{width:min(430px,92vw);background:#fff;border:1px solid #e3e8f1;border-radius:22px;padding:32px;box-shadow:0 25px 80px rgba(20,30,60,.12)}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.login h1{margin:0 0 8px}.login p{margin:0 0 22px;color:#71809a;font-size:13px}.login label{display:block;margin:13px 0 6px;font-weight:700}.login input{width:100%}.login button{width:100%;margin-top:20px}.err{color:#b42318;background:#fff1f0;border:1px solid #ffd6d2;border-radius:10px;padding:10px;font-size:12px;display:none;margin-top:12px}</style></head><body><div class="login"><div class="logo">⚡</div><h1>OmniCast Studio</h1><p>Sign in to your multi-platform publisher workspace.</p><label>Username</label><input id="u" autocomplete="username" autofocus><label>Password</label><input id="p" type="password" autocomplete="current-password"><button class="btn btn-primary" onclick="login()">Sign In</button><div id="e" class="err"></div><div class="muted" style="font-size:11px;margin-top:16px">Local-only access. Multi-platform OAuth credentials remain separate & private.</div><div style="text-align:center;margin-top:14px;font-size:12px"><a href="/setup">First run? Create administrator account</a></div></div><script>async function login(){const e=document.getElementById('e');e.style.display='none';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Login failed');location.href='/';}catch(x){e.textContent=x.message;e.style.display='block'}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
