<!doctype html><html><head><meta charset="utf-8"><title>First Run Setup · YouTube Local Auto Uploader</title><link rel="stylesheet" href="/static/layout.css?v=24"><style>body{display:grid;place-items:center;min-height:100vh}.setup{width:min(470px,92vw);background:#fff;border:1px solid #e3e8f1;border-radius:22px;padding:32px;box-shadow:0 25px 80px rgba(20,30,60,.12)}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#6257f4,#4b42d8);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.setup h1{margin:0 0 8px}.setup p{margin:0 0 22px;color:#71809a;font-size:13px}.setup label{display:block;margin:13px 0 6px;font-weight:700}.setup input{width:100%}.setup button{width:100%;margin-top:20px}.msg{border-radius:10px;padding:10px;font-size:12px;display:none;margin-top:12px}.err{color:#b42318;background:#fff1f0;border:1px solid #ffd6d2}.ok{color:#067647;background:#ecfdf3;border:1px solid #abefc6}</style></head><body><div class="setup"><div class="logo">▶</div><h1>First-Time Setup</h1><p>Create the local administrator account for your private creator workspace. No default password is used.</p><label>Username</label><input id="u" autocomplete="username" value="admin"><label>Password</label><input id="p" type="password" autocomplete="new-password"><label>Confirm Password</label><input id="c" type="password" autocomplete="new-password"><button class="btn btn-primary" onclick="setup()">Create Administrator</button><div id="e" class="msg err"></div><div class="muted" style="font-size:11px;margin-top:16px">Use at least 12 characters. This account is stored locally in SQLite.</div></div><script>async function setup(){const e=document.getElementById('e');e.style.display='none';try{const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value,confirm_password:document.getElementById('c').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Setup failed');location.href='/';}catch(x){e.textContent=x.message;e.style.display='block'}}document.addEventListener('keydown',e=>{if(e.key==='Enter')setup()});</script></body></html>
