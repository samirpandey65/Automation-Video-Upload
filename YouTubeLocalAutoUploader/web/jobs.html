<!doctype html><html><head><meta charset="utf-8"><title>Upload Queue</title><link rel="stylesheet" href="/static/layout.css?v=26"></head><body><div class="app"><aside class="sidebar"><div class="brand-block"><div class="brand-logo">▶</div><div><div class="brand-name">YouTube Local</div><div class="brand-sub">Auto Uploader</div></div></div><div class="nav-group"><a class="nav" href="/">⌂ <span>Dashboard</span></a><a class="nav" href="/upload">↥ <span>Upload to YouTube</span></a><a class="nav" href="/library">▣ <span>Video Library</span></a><a class="nav" href="/scheduler">◷ <span>Account Automation</span></a><a class="nav" href="/channels">◉ <span>YouTube Channels</span></a><a class="nav" href="/connections">⌘ <span>Connections</span></a><a class="nav" href="/analytics">▥ <span>Performance</span></a><a class="nav" href="/jobs">☷ <span>Upload Queue</span></a><a class="nav" href="/logs">≡ <span>Logs</span></a><a class="nav" href="/settings">⚙ <span>Settings</span></a></div></aside><div class="workspace"><main class="main"><h1>Upload Queue</h1><p class="muted">Track scheduled/manual upload jobs, retries, and failures.</p><div id="msg"></div><div class="card"><div class="row"><select id="status"><option value="">All</option><option>pending</option><option>uploading</option><option>completed</option><option>retry_pending</option><option>cancelled</option></select><button class="btn btn-secondary" onclick="load()">Refresh</button></div><div id="jobs" style="margin-top:16px"></div></div></main></div></div><script src="/static/common.js?v=26"></script><script>async function load(){try{const st=document.getElementById('status').value;const d=await api('/api/jobs'+(st?'?status='+encodeURIComponent(st):''));const rows=d.jobs||[];document.getElementById('jobs').innerHTML=rows.length?rows.map(j=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f5"><strong>#${j.id}</strong> · ${esc(j.status)} · attempts ${j.attempt_count||0}<br><span class="muted tiny">video ${esc(String(j.video_id||''))} · channel ${esc(j.channel_id||'')} · ${esc(j.last_error||'')}</span><div style="margin-top:8px">${['failed','retry_pending','cancelled'].includes(j.status)?`<button class="btn btn-secondary btn-sm" onclick="retry(${j.id})">Retry</button>`:''}${['pending','uploading','retry_pending'].includes(j.status)?` <button class="btn btn-secondary btn-sm" onclick="cancelJob(${j.id})">Cancel</button>`:''}</div></div>`).join(''):'<div class="muted">No upload jobs.</div>'}catch(e){document.getElementById('jobs').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}async function retry(id){try{await api('/api/jobs/'+id+'/retry',{method:'POST'});await load()}catch(e){setMessage('msg',e.message,'error')}}async function cancelJob(id){try{await api('/api/jobs/'+id+'/cancel',{method:'POST'});await load()}catch(e){setMessage('msg',e.message,'error')}}load();</script></body></html>
